<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="B.Tech builds mobile-friendly business websites and practical management systems for businesses in Ghana and worldwide."
    />
    <meta name="theme-color" content="#181512" />
    <title>B.Tech | Business Websites and Management Systems</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="page-shell">
      <header class="topbar">
        <div class="brand" id="brandName">ANTIGRAVITY</div>

        <nav class="nav" id="navLinks" aria-label="Main navigation"></nav>

        <div class="top-actions">
          <button class="nav-button" id="navAction">Book a Demo</button>
        </div>
      </header>

      <main class="hero">
        <div class="hero-copy">
          <p class="eyebrow" id="eyebrow">Designing motion that feels alive</p>
          <h1 id="heroTitle">Build bold digital experiences that defy gravity.</h1>
          <p class="subtext" id="heroText">
            We craft immersive product stories, interactive systems, and polished brand experiences that move audiences.
          </p>
          <div class="hero-actions">
            <button class="primary" id="primaryBtn">Get Started</button>
            <button class="secondary" id="secondaryBtn">View Work</button>
          </div>
        </div>
      </main>

      <aside class="control-panel" aria-label="Simulation controls">
        <h2>Field Controls</h2>

        <div class="control-group">
          <label for="particleCount">
            <span>Particle Count</span>
            <strong id="particleCountValue">18</strong>
          </label>
          <input id="particleCount" type="range" min="8" max="80" step="1" value="18" />
        </div>

        <div class="control-group">
          <label for="gravityStrength">
            <span>Gravity Strength</span>
            <strong id="gravityValue">120</strong>
          </label>
          <input id="gravityStrength" type="range" min="40" max="220" step="1" value="120" />
        </div>

        <div class="control-group">
          <label for="themeSelect">
            <span>Color Theme</span>
          </label>
          <select id="themeSelect">
            <option value="aurora">Aurora</option>
            <option value="sunset">Sunset</option>
            <option value="violet">Violet</option>
            <option value="ice">Ice</option>
          </select>
        </div>

        <div class="control-group audio-group">
          <label for="soundToggle">
            <span>Sound</span>
            <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true">On</button>
          </label>

          <label for="volumeControl">
            <span>Volume</span>
            <strong id="volumeValue">60%</strong>
          </label>
          <input id="volumeControl" type="range" min="0" max="100" step="1" value="60" />
        </div>
      </aside>

      <section id="features" class="content-section features" aria-label="Services"></section>
      <section id="detailPanel" class="content-section detail-panel" aria-label="Packages"></section>
      <section id="resourcePanel" class="content-section resource-panel" aria-label="Portfolio concepts and contact"></section>
    </div>

    <a
      class="whatsapp-float"
      id="whatsappFloat"
      href="https://wa.me/233242278244"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Chat with B.Tech on WhatsApp"
      title="Chat with B.Tech on WhatsApp"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M16 3.2a12.5 12.5 0 0 0-10.7 19l-1.6 6 6.2-1.6A12.5 12.5 0 1 0 16 3.2Zm0 22.7a10.2 10.2 0 0 1-5.2-1.4l-.4-.2-3.7 1 1-3.6-.3-.4A10.2 10.2 0 1 1 16 25.9Zm5.6-7.6c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.4 8.4 0 0 1-2.5-1.5 9.4 9.4 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.7l.5-.6.3-.5a.6.6 0 0 0 0-.6c-.1-.2-.7-1.7-1-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.6 1.2 3 1.4 3.2 2.3 3.5 5.6 4.8c.8.3 1.4.5 1.9.6.8.3 1.5.2 2 .1.6-.1 1.8-.8 2-1.5s.3-1.3.2-1.5-.3-.3-.6-.5Z" />
      </svg>
    </a>

    <script src="script.js"></script>
  </body>
</html>
